apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cosmocomponents.cosmonaut.galileostd.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
spec:
  group: cosmonaut.galileostd.io
  names:
    kind: CosmoComponent
    listKind: CosmoComponentList
    plural: cosmocomponents
    singular: cosmocomponent
    shortNames:
      - cc
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Plugin
          type: string
          jsonPath: .spec.plugin
        - name: Type
          type: string
          jsonPath: .spec.type
        - name: Health
          type: string
          jsonPath: .status.health
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - plugin
                - type
                - endpoint
              properties:
                plugin:
                  type: string
                  description: >
                    Name of the plugin that handles this component.
                    Must match a registered plugin (e.g. trino, spark, airflow).
                type:
                  type: string
                  description: >
                    Category of this component
                    (e.g. query-engine, processing, orchestration, storage).
                endpoint:
                  type: string
                  pattern: '^https?://'
                  description: Base URL to reach this component.
                healthCheckIntervalSeconds:
                  type: integer
                  default: 30
                  description: How often to run the health check, in seconds.
                config:
                  type: object
                  additionalProperties:
                    type: string
                  description: Arbitrary plugin-specific configuration key-value pairs.
                auth:
                  type: object
                  properties:
                    vaultPath:
                      type: string
                      description: >
                        Vault secret path containing credentials.
                        Example: secret/data/trino/credentials
                    secretRef:
                      type: object
                      required:
                        - name
                        - key
                      properties:
                        name:
                          type: string
                          description: Name of the Kubernetes Secret.
                        key:
                          type: string
                          description: Key within the Secret to use.
            status:
              type: object
              properties:
                health:
                  type: string
                  enum:
                    - healthy
                    - degraded
                    - unhealthy
                    - unknown
                message:
                  type: string
                lastChecked:
                  type: string
                  format: date-time
                capabilities:
                  type: array
                  items:
                    type: string
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - reason
                      - lastTransitionTime
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
                        format: int64
