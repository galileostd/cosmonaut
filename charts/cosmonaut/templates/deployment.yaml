apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cosmonaut.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cosmonaut.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cosmonaut.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cosmonaut.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "cosmonaut.fullname" . }}
      containers:
        - name: control-plane
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: api
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            # Core
            - name: COSMONAUT_DEV
              value: "{{ .Values.dev }}"
            - name: COSMONAUT_API_ADDR
              value: ":8080"
            - name: COSMONAUT_HEALTH_ADDR
              value: ":8081"
            - name: COSMONAUT_METRICS_ADDR
              value: ":9090"
            
            # Auth
            - name: COSMONAUT_AUTH_ENABLED
              value: "{{ .Values.auth.enabled }}"
            {{- if .Values.auth.enabled }}
            - name: COSMONAUT_OIDC_ISSUER
              value: "{{ .Values.auth.oidc.issuerURL }}"
            - name: COSMONAUT_OIDC_CLIENT_ID
              value: "{{ .Values.auth.oidc.clientID }}"
            {{- end }}
            
            # Database
            - name: COSMONAUT_DB_DRIVER
              value: "{{ .Values.database.driver }}"
            - name: COSMONAUT_DB_HOST
              value: "{{ .Values.database.host }}"
            - name: COSMONAUT_DB_PORT
              value: "{{ .Values.database.port }}"
            - name: COSMONAUT_DB_USER
              value: "{{ .Values.database.user }}"
            - name: COSMONAUT_DB_PASSWORD
              value: "{{ .Values.database.password }}"
            - name: COSMONAUT_DB_NAME
              value: "{{ .Values.database.database }}"
            - name: COSMONAUT_DB_SSL_MODE
              value: "{{ .Values.database.sslMode }}"
            - name: COSMONAUT_DB_MAX_OPEN_CONNS
              value: "{{ .Values.database.maxOpenConns }}"
            - name: COSMONAUT_DB_MAX_IDLE_CONNS
              value: "{{ .Values.database.maxIdleConns }}"
            - name: COSMONAUT_DB_DEBUG
              value: "{{ .Values.database.debug }}"
            
            # Database URL (construída)
            - name: COSMONAUT_DATABASE_URL
              value: "postgresql://$(COSMONAUT_DB_USER):$(COSMONAUT_DB_PASSWORD)@$(COSMONAUT_DB_HOST):$(COSMONAUT_DB_PORT)/$(COSMONAUT_DB_NAME)?sslmode=$(COSMONAUT_DB_SSL_MODE)"

          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}