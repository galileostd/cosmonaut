replicaCount: 1

image:
  repository: cosmonaut
  pullPolicy: IfNotPresent
  tag: "dev"

# Set to "true" for development — enables verbose logging
dev: "true"

auth:
  enabled: false
  oidc:
    issuerURL: ""
    clientID: "cosmonaut"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
